sonar.projectKey=bicho
sonar.projectName=bicho
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Código del proyecto
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/src
sonar.test.inclusions=**/*.test.js,backend/test/**/*.js

# Fuera del análisis
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/reportes/**,**/*.test.js,frontend/src/reportWebVitals.js,frontend/src/setupTests.js

# Cobertura de Jest
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info